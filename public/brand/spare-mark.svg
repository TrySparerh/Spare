<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Spare mark</title>

  <!-- ORBITAL ARCS ------------------------------------------------------- -->
  <g fill="none" stroke="#1B1240" stroke-linecap="round">

    <!-- upper-left ring, open toward lower-right -->
    <path d="M 118 300 A 190 190 0 0 1 404 150" stroke-width="13"/>

    <!-- lower-right ring, mirrored -->
    <path d="M 394 212 A 190 190 0 0 1 108 362" stroke-width="13"/>

    <!-- inner tilted ring, smaller and lighter -->
    <path d="M 176 286 A 112 112 0 0 1 330 168" stroke-width="10"/>
    <path d="M 336 226 A 112 112 0 0 1 182 344" stroke-width="10"/>
  </g>

  <!-- SPARKLES ----------------------------------------------------------- -->
  <g fill="#1B1240">

    <!-- primary: long axis running NE/SW, needle-thin waist -->
    <path d="M 256 14
             Q 268 244 430 256
             Q 268 268 256 498
             Q 244 268 82 256
             Q 244 244 256 14 Z"
          transform="rotate(45 256 256)"/>

    <!-- secondary: smaller, offset lower-right, same geometry scaled down -->
    <path d="M 256 14
             Q 268 244 430 256
             Q 268 268 256 498
             Q 244 268 82 256
             Q 244 244 256 14 Z"
          transform="rotate(45 256 256) translate(92 96) scale(0.34) translate(-172 -178)"/>
  </g>
</svg>
