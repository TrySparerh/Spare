[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./addresses" }, { access = "read", path = "./config" }]

# One copy of each dependency: a single v4-core for everything, so periphery
# and core types never mismatch across nested copies.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "solmate/=lib/v4-core/lib/solmate/",
]

[rpc_endpoints]
rhc = "${RHC_RPC_URL}"
rhc_testnet = "https://rpc.testnet.chain.robinhood.com"

[fuzz]
runs = 512

# 1600 runs x depth 64 = 102,400 handler calls per invariant (the depth the
# 2026-10-02 AI-assisted audit ran all 10 invariants at). Cost: the two invariant suites take
# `forge test` from ~4 s to ~50 s wall on a 64-thread dev box (~330 s of CPU),
# so budget ~3 min on a 2-vCPU CI runner.
[invariant]
runs = 1600
depth = 64
