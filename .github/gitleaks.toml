# gitleaks configuration, for a full-history scan from the repo root:
#
#   gitleaks git --config .github/gitleaks.toml --redact .
#
# The `gitleaks` job of the Security workflow runs exactly that (gitleaks 8.30.1,
# sha256-verified), from .github/workflows/security.yml.
#
# The full default rule set plus three rules for Spare's own secret shapes,
# allowlists for values that are public by construction, and one triaged
# false positive. Anything else that trips a rule
# fails the scan: rotate the secret first, then decide about history.
title = "spare gitleaks config"

[extend]
useDefault = true

# Spare's own secret shapes that the default rules miss.

[[rules]]
id = "evm-private-key"
description = "A 32-byte hex EVM private key assigned to a key-like name (DEPLOYER_PK, KEEPER_PK, PRIVATE_KEY, ...)"
regex = '''(?i)(?:_PK|\bPK|PRIVATE_?KEY|SIGNER_?KEY|DEPLOYER_?KEY|KEEPER_?KEY)["']?\s*[:=]\s*["'`]?((?:0x)?[0-9a-f]{64})\b'''
secretGroup = 1
keywords = ["pk", "private", "key"]

[[rules]]
id = "alchemy-rpc-url"
description = "Alchemy RPC URL with its API key in the path"
regex = '''(?i)\.alchemy(?:api)?\.(?:com|io)/v2/([A-Za-z0-9_\-]{16,})'''
secretGroup = 1
keywords = ["alchemy"]

[[rules.allowlists]]
# Redaction tests carry obviously fake keys ("fAkE...", "SECRET...") so they can
# assert the key never reaches a client. A real Alchemy key is random base62.
description = "placeholder keys in tests"
stopwords = ["fake", "secret", "placeholder", "example", "dummy"]

[[rules]]
id = "uuid-platform-token"
description = "A UUID-format account, team or project token (hosting and CI platforms) assigned to a *_TOKEN name"
regex = '''(?i)\b[A-Z][A-Z0-9_]*_TOKEN["']?\s*[:=]\s*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'''
secretGroup = 1
keywords = ["_token"]

[[allowlists]]
description = "EVM addresses are public identifiers (token, pool, contract addresses), never secrets"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

[[allowlists]]
description = "anvil/hardhat default accounts: keys of the public test mnemonic, local forks only"
regexTarget = "secret"
regexes = ['''(?i)^(?:0x)?(?:ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80|59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d|5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a|7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6|47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a|8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba|92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e|4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356|dbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97|2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6)$''']

[[allowlists]]
description = "i18next translation keys (i18nKey=\"docs.section.p2\")"
regexTarget = "line"
regexes = ['''i18nKey=["'][A-Za-z0-9_.\-]+["']''']

[[allowlists]]
# Triaged false positive of the default generic-api-key rule: a public
# keccak256 role id (TOKEN_PAUSER_ROLE of the stock-token issuer) in an audit
# test. Scoped to that rule and that line. A real secret is rotated, never
# added here.
description = "Triaged false positives"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''bytes32 constant TOKEN_PAUSER_ROLE = 0x[0-9a-f]{64};''']
