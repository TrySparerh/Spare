# Static analysis and secret scanning, on every push and pull request and weekly
# (new detector and rule releases can find old code).
#
#   slither   contracts/src, fails on any High-impact finding
#   semgrep   default + GitHub Actions + Dockerfile rule packs, fails on ERROR
#   gitleaks  the FULL git history with .github/gitleaks.toml, fails on any leak
#
# Slither and Semgrep upload SARIF to code scanning (all severities) where the
# token may write it; only those two jobs get security-events: write.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  slither:
    name: Slither (fail on high)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload-sarif: Slither results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.6 crytic-compile==0.4.2
      - name: Slither
        working-directory: contracts
        # Dependencies, tests and scripts are filtered out; findings in src/ at
        # Medium and below are reported to code scanning, High fails the job.
        run: >-
          slither .
          --filter-paths "contracts/(lib|test|script)/"
          --exclude-dependencies
          --sarif ../slither.sarif
          --fail-high
      - name: Upload SARIF
        if: always() && hashFiles('slither.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: slither.sarif
          category: slither

  semgrep:
    name: Semgrep (fail on error)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload-sarif: Semgrep results to code scanning
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_RULES: --config p/default --config p/github-actions --config p/dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.178.0
      - name: Semgrep (all severities, SARIF)
        run: semgrep scan $SEMGREP_RULES --metrics=off --sarif --output semgrep.sarif
      - name: Semgrep gate (ERROR severity fails)
        run: semgrep scan $SEMGREP_RULES --metrics=off --severity ERROR --error
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (release tarball, sha256-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit
        # --redact: a hit prints its location, never the value.
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git
          --config .github/gitleaks.toml
          --redact
          --no-banner
          --verbose
          .
